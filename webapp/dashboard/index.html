<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Аналитика — Black Magic Woman</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@700,100&family=Manrope:wght@300;400;500;600&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  /* Одна тема — «матовое стекло на размытом фото»: фон сам задаёт настроение,
     поэтому светлой/тёмной версии нет, все цвета заданы явно. */
  :root {
    color-scheme: dark;
    --sky-deep: #3d7a8f;
    --lime: #dff26b;
    --text: #ffffff;
    --text-2: rgba(255, 255, 255, 0.8);
    --text-3: rgba(255, 255, 255, 0.58);
    --line: rgba(255, 255, 255, 0.22);
    --up: #e8f78a;
    --down: #ffc6b3;
    --glass-bg: linear-gradient(160deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.08) 55%, rgba(255, 255, 255, 0.16) 100%);
    --glass-border: rgba(255, 255, 255, 0.38);
    --glass-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -20px 40px rgba(255, 255, 255, 0.06), 0 24px 60px rgba(14, 44, 58, 0.22);
    --r-tile: 22%;
    --r-panel: 30px;
    --num: "Doto", "Courier New", monospace;
    --ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--sky-deep); }
  body { margin: 0; color: var(--text); font-family: var(--ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

  /* ---------- фон: размытое «фото» ---------- */
  .scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(185deg, #4f8ea3 0%, #5d98ac 40%, #6a9aa8 75%, #5b8b9b 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(56px); }
  .b1 { left: 12%; top: 14%; width: 58vw; height: 13vw; background: radial-gradient(closest-side, rgba(245, 176, 143, 0.95), rgba(245, 176, 143, 0)); transform: rotate(-6deg); animation: drift1 38s ease-in-out infinite alternate; }
  .b2 { left: 4%; top: 60%; width: 48vw; height: 9vw; background: radial-gradient(closest-side, rgba(226, 124, 96, 0.85), rgba(226, 124, 96, 0)); transform: rotate(4deg); animation: drift2 44s ease-in-out infinite alternate; }
  .b3 { left: 36%; top: 16%; width: 24vw; height: 70vh; background: radial-gradient(closest-side, rgba(58, 52, 56, 0.7), rgba(58, 52, 56, 0)); }
  .b4 { left: 42%; top: 38%; width: 30vw; height: 26vw; background: radial-gradient(closest-side, rgba(241, 231, 211, 0.8), rgba(241, 231, 211, 0)); animation: drift1 52s ease-in-out infinite alternate-reverse; }
  .b5 { right: -12%; top: -14%; width: 52vw; height: 46vw; background: radial-gradient(closest-side, rgba(179, 214, 228, 0.75), rgba(179, 214, 228, 0)); }
  .b6 { right: 6%; top: 78%; width: 44vw; height: 8vw; background: radial-gradient(closest-side, rgba(243, 170, 139, 0.7), rgba(243, 170, 139, 0)); transform: rotate(-3deg); animation: drift2 40s ease-in-out infinite alternate-reverse; }
  .b7 { left: -8%; top: 30%; width: 30vw; height: 22vw; background: radial-gradient(closest-side, rgba(110, 170, 225, 0.55), rgba(110, 170, 225, 0)); }
  .grain { position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  @keyframes drift1 { from { translate: 0 0; } to { translate: 6vw 3vh; } }
  @keyframes drift2 { from { translate: 0 0; } to { translate: -5vw -2vh; } }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none !important; } }

  /* ---------- стекло ---------- */
  .glass {
    position: relative;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(28px) saturate(160%) brightness(0.9);
    backdrop-filter: blur(28px) saturate(160%) brightness(0.9);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(84, 132, 150, 0.9); }
  }

  /* ---------- вход ---------- */
  .login-wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 360px; border-radius: var(--r-panel); padding: 32px 28px; text-align: center; display: grid; gap: 12px; }
  .login-card h1 { font-weight: 300; font-size: 28px; margin: 0; }
  .login-card .muted { color: var(--text-2); font-size: 13px; margin: 0 0 8px; }
  .error { font-size: 12px; color: var(--down); margin: 0; }

  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding-inline: 32px; padding-block: 28px 72px; }

  /* ---------- шапка ---------- */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); margin: 0 0 6px; }
  .topbar h1 { font-weight: 300; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
  .controls { display: flex; align-items: center; gap: 10px; }

  .seg { display: inline-flex; padding: 4px; border-radius: 999px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: background 0.2s, color 0.2s; }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: rgba(255, 255, 255, 0.34); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 4px 12px rgba(14, 44, 58, 0.15); }
  .round-btn { width: 42px; height: 42px; border-radius: 50%; color: var(--text); font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }

  /* ---------- плитки KPI ---------- */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 18px; }
  .tile { aspect-ratio: 1; border-radius: var(--r-tile); overflow: hidden; max-width: 100%; }
  .tile.accent { background: linear-gradient(175deg, #6ea8e8 0%, #93bde6 38%, #c9d9e2 70%, #efe7d2 100%); border-color: rgba(255, 255, 255, 0.5); }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tile-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18%; gap: 4px; }
  .tile-label { font-size: 12px; color: var(--text-2); letter-spacing: 0.02em; }
  .tile-num { font-family: var(--num); font-weight: 700; font-size: clamp(36px, 5vw, 64px); line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .tile-word { font-size: 13px; font-weight: 500; }
  .tile-word.up { color: var(--up); }
  .tile-word.down { color: var(--down); }
  .tile-word.flat { color: var(--text-2); }
  .tile.accent .tile-label, .tile.accent .tile-word.flat { color: rgba(255, 255, 255, 0.92); }
  .tile.accent .tile-num, .tile.accent .tile-word { text-shadow: 0 1px 14px rgba(40, 80, 120, 0.25); }

  /* ---------- панели ---------- */
  .panel { border-radius: var(--r-panel); padding: 22px 24px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .panel-title { font-size: 15px; font-weight: 500; margin: 0; }
  .chip { font-size: 11px; color: var(--text-2); padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.22); white-space: nowrap; }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 18px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 18px; }
  .chart-panel { margin-bottom: 18px; }
  .chart-wrap { position: relative; height: 290px; }
  .note { font-size: 12px; color: var(--text-3); margin: 10px 0 0; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .rows > .row:first-child { border-top: 0; }
  .row-label { color: var(--text-2); font-size: 14px; min-width: 0; }
  .row-sub { color: var(--text-3); font-size: 12px; }
  .row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .val.muted { color: var(--text-2); font-weight: 500; font-size: 13px; }
  .delta { font-size: 12px; font-weight: 500; white-space: nowrap; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--text-3); }
  .empty { color: var(--text-3); font-size: 13px; padding: 10px 0; margin: 0; }

  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 14px; }
  .mini-cell { border-radius: 18px; padding: 12px 12px 10px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); min-width: 0; }
  .mini-num { font-family: var(--num); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
  .mini-cap { font-size: 11px; color: var(--text-2); margin-top: 6px; line-height: 1.3; }
  .subhead { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); margin: 4px 0 2px; }

  .rank { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: rgba(255, 255, 255, 0.14); flex-shrink: 0; }
  .rank.top { background: var(--lime); color: #2f3b12; }
  .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .bar { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); overflow: hidden; width: 90px; flex-shrink: 0; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, rgba(255, 255, 255, 0.55), #fff); }
  .kind-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: 1px; }

  .form { margin-top: 12px; padding-top: 14px; border-top: 1px dashed rgba(255, 255, 255, 0.3); display: grid; gap: 8px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .field { border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.12); color: var(--text); padding: 10px 12px; font-size: 13px; min-width: 0; width: 100%; }
  .field::placeholder { color: var(--text-3); }
  .field option { color: #1c3642; }
  .form-row .field { flex: 1 1 140px; width: auto; }
  .primary { border: 0; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer; color: #20414e; background: linear-gradient(180deg, #ffffff, #e7eef1); box-shadow: 0 6px 18px rgba(14, 44, 58, 0.2); }
  .primary:hover { filter: brightness(1.04); }
  .hint { font-size: 11px; color: var(--text-3); margin: 0; }

  svg.spark { display: block; overflow: visible; }

  @media (max-width: 980px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .grid-3 > :last-child { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .wrap { padding-inline: 16px; }
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .tiles { gap: 12px; }
    .tile-center { padding: 16%; }
    .tile-label { font-size: 11px; }
    .tile-word { font-size: 12px; }
    .panel { padding: 18px; border-radius: 24px; }
    .chart-wrap { height: 240px; }
    .bar { width: 60px; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="blob b7"></div><div class="blob b5"></div><div class="blob b3"></div>
  <div class="blob b1"></div><div class="blob b4"></div><div class="blob b2"></div><div class="blob b6"></div>
  <div class="grain"></div>
</div>

<div id="loginScreen" class="login-wrap">
  <form id="loginForm" class="login-card glass">
    <h1>Аналитика бота</h1>
    <p class="muted">Приватный дашборд — введите токен доступа</p>
    <input class="field" type="password" id="loginToken" placeholder="Токен" autocomplete="off" aria-label="Токен доступа" required />
    <button class="primary" type="submit">Войти</button>
    <p id="loginError" class="error hidden"></p>
  </form>
</div>

<main id="app" class="wrap hidden">
  <header class="topbar">
    <div>
      <p class="eyebrow">Black Magic Woman</p>
      <h1>Аналитика бота</h1>
    </div>
    <div class="controls">
      <div class="seg glass" id="rangeSeg" role="group" aria-label="Период">
        <button type="button" data-days="7">7 дней</button>
        <button type="button" data-days="30" class="active">30 дней</button>
        <button type="button" data-days="90">90 дней</button>
      </div>
      <button type="button" id="logoutBtn" class="round-btn glass" aria-label="Выйти" title="Выйти">⏻</button>
    </div>
  </header>

  <section class="tiles" aria-label="Главные показатели">
    <div class="tile glass accent" id="tileUsers"></div>
    <div class="tile glass" id="tileDau"></div>
    <div class="tile glass" id="tileNew"></div>
    <div class="tile glass" id="tileSubs"></div>
  </section>

  <section class="panel glass chart-panel">
    <div class="panel-head">
      <h2 class="panel-title" id="chartTitle">Рост подписчиков</h2>
      <div class="seg glass" id="chartSeg" role="group" aria-label="Метрика графика">
        <button type="button" data-metric="subs" class="active">Подписчики</button>
        <button type="button" data-metric="dau">DAU</button>
        <button type="button" data-metric="new">Новые</button>
        <button type="button" data-metric="games">Игры</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="mainChart" role="img" aria-label="График выбранной метрики по дням с отметками релизов"></canvas></div>
    <p class="note" id="chartNote"></p>
  </section>

  <section class="grid-3">
    <div class="panel glass">
      <div class="panel-head"><h2 class="panel-title">Подписка</h2><span class="chip" id="flowChip">—</span></div>
      <div class="rows" id="flowRows"></div>
    </div>
    <div class="panel glass">
      <div class="panel-head"><h2 class="panel-title">Фичи</h2><span class="chip">в среднем за день</span></div>
      <div class="rows" id="featRows"></div>
    </div>
    <div class="panel glass">
      <div class="panel-head"><h2 class="panel-title">Активность</h2><span class="chip" id="actChip">—</span></div>
      <div class="rows" id="actRows"></div>
    </div>
  </section>

  <section class="grid-2">
    <div class="panel glass">
      <div class="panel-head"><h2 class="panel-title">Турнир групп</h2><span class="chip" id="tourChip">—</span></div>
      <div class="mini" id="tourMini"></div>
      <p class="subhead">Лидеры по очкам</p>
      <div class="rows" id="tourBands"></div>
    </div>
    <div class="panel glass">
      <div class="panel-head">
        <h2 class="panel-title">Топ активных</h2>
        <div class="seg glass" id="lbSeg" role="group" aria-label="Рейтинг">
          <button type="button" data-lb="rockle" class="active">по игре</button>
          <button type="button" data-lb="active">по активности</button>
        </div>
      </div>
      <div class="rows" id="lbRows"></div>
    </div>
  </section>

  <section class="panel glass">
    <div class="panel-head"><h2 class="panel-title">Релизы</h2><span class="chip" id="relChip">—</span></div>
    <div class="rows" id="relRows"></div>
    <form class="form" id="relForm">
      <input class="field" type="text" id="relLabel" maxlength="200" placeholder="Например: новый тест по обложкам" aria-label="Название релиза" required />
      <div class="form-row">
        <select class="field" id="relKind" aria-label="Вид релиза">
          <option value="content">контент</option>
          <option value="feature">фича</option>
          <option value="giveaway">розыгрыш</option>
        </select>
        <input class="field" type="datetime-local" id="relDate" aria-label="Дата и время релиза, UTC" required />
        <button class="primary" type="submit">Добавить</button>
      </div>
      <p class="hint">Дата и время в UTC. Релиз появится отметкой на графике.</p>
      <p id="relError" class="error hidden"></p>
    </form>
  </section>
</main>

<script>
(function () {
  "use strict";
  var API = "";
  var state = {
    token: localStorage.getItem("dashboard_token") || "",
    days: 30,
    lb: "rockle",
    metric: "subs",
    releases: []
  };
  var chart = null;

  // ---------- утилиты ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtPct(v) { return v === null || v === undefined ? "н/д" : (v > 0 ? "+" : "") + v.toFixed(1) + "%"; }
  function signed(v) { return v === null || v === undefined ? "н/д" : (v > 0 ? "+" : "") + Math.round(v); }
  function cls(v) { return v === null || v === undefined || v === 0 ? "flat" : (v > 0 ? "up" : "down"); }
  function arrow(v) { return v === null || v === undefined || v === 0 ? "" : (v > 0 ? "▲ " : "▼ "); }
  function secs(s) {
    if (s === null || s === undefined) return "—";
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function sum(series) { return series.reduce(function (a, r) { return a + r.n; }, 0); }
  function avg(series) { return series.length ? sum(series) / series.length : 0; }

  async function apiFetch(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {}, { Authorization: "Bearer " + state.token });
    if (opts.body) headers["Content-Type"] = "application/json";
    var res = await fetch(API + path, Object.assign({}, opts, { headers: headers }));
    if (res.status === 401) {
      logout();
      throw new Error("unauthorized");
    }
    if (!res.ok) throw new Error("request_failed:" + path);
    return res.json();
  }
  function series(metric) {
    return apiFetch("/api/dashboard/series?metric=" + encodeURIComponent(metric) + "&days=" + state.days)
      .then(function (d) { return d.series; });
  }

  // ---------- кольца на плитках ----------
  function polar(r, deg) { var a = (deg - 90) * Math.PI / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; }
  function line(p1, p2, opacity, width) {
    return '<line x1="' + p1[0].toFixed(2) + '" y1="' + p1[1].toFixed(2) + '" x2="' + p2[0].toFixed(2) + '" y2="' + p2[1].toFixed(2) +
      '" stroke="#fff" stroke-opacity="' + opacity + '" stroke-width="' + width + '" stroke-linecap="round"/>';
  }
  // Кольцо-циферблат из 60 рисок: светлые риски = доля (frac). Последние
  // HATCH светлых рисок той же длины, но толще — отмечают конец доли.
  function tickRing(frac) {
    var out = "", N = 60, STEP = 360 / N, HATCH = 4;
    var active = Math.round(Math.max(0, Math.min(1, frac)) * N);
    var hatchFrom = active - Math.min(HATCH, active);
    for (var k = 0; k < N; k++) {
      var deg = k * STEP;
      if (k >= hatchFrom && k < active) out += line(polar(75, deg), polar(84, deg), 1, 2.2);
      else if (k < active) out += line(polar(75, deg), polar(84, deg), 0.95, 1.6);
      else out += line(polar(76, deg), polar(81, deg), 0.35, 1.1);
    }
    return out;
  }
  // Кольцо акцентной плитки: тонкая окружность и лаймовая дуга из двух «нитей».
  function arcRing(frac) {
    frac = Math.max(0, Math.min(1, frac));
    var c1 = 2 * Math.PI * 80, c2 = 2 * Math.PI * 84;
    return '<circle cx="100" cy="100" r="80" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.6"/>' +
      '<circle cx="100" cy="100" r="84" fill="none" stroke="#f4ffb0" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="' +
      (c2 * frac * 0.92).toFixed(1) + " " + c2.toFixed(1) + '" transform="rotate(-84 100 100)"/>' +
      '<circle cx="100" cy="100" r="80" fill="none" stroke="#dff26b" stroke-width="3" stroke-linecap="round" stroke-dasharray="' +
      (c1 * frac).toFixed(1) + " " + c1.toFixed(1) + '" transform="rotate(-90 100 100)"/>';
  }
  // opts.ring — что означает кольцо: всплывает при наведении на плитку.
  function tile(id, opts) {
    var el = document.getElementById(id);
    el.innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true">' + (opts.accent ? arcRing(opts.frac) : tickRing(opts.frac)) + "</svg>" +
      '<div class="tile-center"><span class="tile-label">' + esc(opts.label) + '</span><span class="tile-num">' + esc(opts.num) +
      '</span><span class="tile-word ' + opts.cls + '">' + esc(opts.word) + "</span></div>";
    el.title = "Кольцо: " + opts.ring;
    el.setAttribute("aria-label", opts.label + ": " + opts.num + ", " + opts.word + ". Кольцо: " + opts.ring);
  }

  function sparkSvg(values) {
    if (!values.length) return "";
    var w = 56, h = 22, min = Math.min.apply(null, values), max = Math.max.apply(null, values), r = max - min || 1;
    var st = values.length > 1 ? w / (values.length - 1) : 0;
    var pts = values.map(function (v, i) { return [i * st, h - (v - min) / r * (h - 3) - 1.5]; });
    var poly = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var last = pts[pts.length - 1];
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true">' +
      '<polyline points="0,' + h + " " + poly + " " + last[0].toFixed(1) + "," + h + '" fill="rgba(255,255,255,0.14)" stroke="none"/>' +
      '<polyline points="' + poly + '" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.4" fill="#dff26b"/></svg>';
  }
  function row(label, right, sub) {
    return '<div class="row"><span class="row-label">' + label + (sub ? ' <span class="row-sub">' + sub + "</span>" : "") +
      '</span><div class="row-right">' + right + "</div></div>";
  }
  function delta(v, text) { return '<span class="delta ' + cls(v) + '">' + text + "</span>"; }
  function mini(n, cap) { return '<div class="mini-cell"><div class="mini-num">' + n + '</div><div class="mini-cap">' + cap + "</div></div>"; }
  function rankRow(i, name, right) {
    return '<div class="row"><span class="rank' + (i === 0 ? " top" : "") + '">' + (i + 1) + '</span><span class="who">' + name + "</span>" + right + "</div>";
  }

  // ---------- вход / выход ----------
  function showApp() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  }
  function showLogin(errorMsg) {
    document.getElementById("app").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
    var err = document.getElementById("loginError");
    err.textContent = errorMsg || "";
    err.classList.toggle("hidden", !errorMsg);
  }
  function logout() {
    state.token = "";
    localStorage.removeItem("dashboard_token");
    showLogin();
  }

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var token = document.getElementById("loginToken").value.trim();
    if (!token) return;
    try {
      var res = await fetch(API + "/api/dashboard/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token })
      });
      if (!res.ok) {
        showLogin("Неверный токен");
        return;
      }
      state.token = token;
      localStorage.setItem("dashboard_token", token);
      showApp();
      loadAll();
    } catch (err) {
      showLogin("Не удалось подключиться");
    }
  });
  document.getElementById("logoutBtn").addEventListener("click", logout);

  function wireSeg(id, attr, onChange) {
    var box = document.getElementById(id);
    box.addEventListener("click", function (e) {
      var btn = e.target.closest("button");
      if (!btn) return;
      box.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b === btn); });
      onChange(btn.dataset[attr]);
    });
  }
  function report(err) { if (err.message !== "unauthorized") console.error(err); }
  wireSeg("rangeSeg", "days", function (v) { state.days = parseInt(v, 10); loadAll(); });
  wireSeg("chartSeg", "metric", function (v) { state.metric = v; loadMainChart().catch(report); });
  wireSeg("lbSeg", "lb", function (v) { state.lb = v; loadLeaderboard().catch(report); });

  // ---------- плитки и панели ----------
  function renderTiles(kpi, flow) {
    var subShare = kpi.total ? kpi.subscribed / kpi.total : 0;
    tile("tileUsers", {
      accent: true, frac: subShare, label: "Пользователи", num: String(kpi.total), cls: "flat",
      word: Math.round(subShare * 100) + "% в канале", ring: "доля пользователей, подписанных на канал"
    });

    var stick = kpi.stickiness_pct;
    tile("tileDau", {
      frac: stick === null ? 0 : stick / 100, label: "Средний DAU", num: kpi.avg_dau.toFixed(1), cls: cls(kpi.dau_delta_pct),
      word: arrow(kpi.dau_delta_pct) + fmtPct(kpi.dau_delta_pct) + " к прошлым",
      ring: "липкость " + (stick === null ? "н/д" : stick.toFixed(1) + "%") + " (средний DAU / уникальные за период)"
    });

    // Дельта в процентах → доля текущего притока от прошлого окна (кольцо полное, если приток не упал).
    var newPct = kpi.new_users_delta_pct;
    var newFrac = newPct === null ? (kpi.new_users > 0 ? 1 : 0) : Math.min(1, 1 + newPct / 100);
    tile("tileNew", {
      frac: newFrac, label: "Новых за " + kpi.days + " дн.", num: String(kpi.new_users), cls: cls(newPct),
      word: arrow(newPct) + fmtPct(newPct) + " к прошлым", ring: "приток новых относительно прошлого окна такой же длины"
    });

    var moved = flow.subscribed + flow.unsubscribed;
    tile("tileSubs", {
      frac: moved ? flow.subscribed / moved : 0, label: "Подписчики", num: String(kpi.subscribed), cls: cls(flow.net),
      word: signed(flow.net) + " за " + flow.days + " дн.",
      ring: flow.subscribed + " подписались, " + flow.unsubscribed + " отписались за период"
    });
  }

  function renderFlow(flow) {
    document.getElementById("flowRows").innerHTML =
      row("Подписалось", '<span class="val">' + flow.subscribed + "</span>" +
        delta(flow.subscribed_delta, arrow(flow.subscribed_delta) + signed(flow.subscribed_delta))) +
      // Рост отписок — плохо, поэтому цвет по обратному знаку, а стрелка по фактическому.
      row("Отписалось", '<span class="val">' + flow.unsubscribed + "</span>" +
        '<span class="delta ' + cls(-flow.unsubscribed_delta) + '">' + arrow(flow.unsubscribed_delta) + signed(flow.unsubscribed_delta) + "</span>") +
      row("Чистый прирост", '<span class="val">' + signed(flow.net) + "</span>" +
        delta(flow.net_delta, arrow(flow.net_delta) + signed(flow.net_delta)));
  }

  function renderActivity(kpi) {
    document.getElementById("actRows").innerHTML =
      row("Средний DAU", '<span class="val">' + kpi.avg_dau.toFixed(1) + "</span>" + delta(kpi.dau_delta_pct, arrow(kpi.dau_delta_pct) + fmtPct(kpi.dau_delta_pct))) +
      row("Уникальных", '<span class="val">' + kpi.unique_active + "</span>") +
      row("Липкость", '<span class="val">' + (kpi.stickiness_pct === null ? "н/д" : kpi.stickiness_pct.toFixed(1) + "%") + "</span>", "ср. DAU / уникальные") +
      row("Новых", '<span class="val">' + kpi.new_users + "</span>" + delta(kpi.new_users_delta_pct, arrow(kpi.new_users_delta_pct) + fmtPct(kpi.new_users_delta_pct)));
  }

  function renderFeatures(playlist, rockle, tests, tournament) {
    function feat(label, s) {
      return row(label, sparkSvg(s.slice(-14).map(function (r) { return r.n; })) + '<span class="val">' + avg(s).toFixed(1) + "</span>");
    }
    document.getElementById("featRows").innerHTML =
      feat("Плейлист дня", playlist) + feat("«Найди группу»", rockle) + feat("Тесты пройдено", tests) + feat("Турнир групп", tournament);
  }

  function renderTournament(opens, runs, promo, bands) {
    document.getElementById("tourMini").innerHTML =
      mini(sum(opens), "открытий") + mini(sum(runs), "засчитано забегов") + mini(sum(promo), "переходов на вечеринку");
    var maxPts = bands.length ? bands[0].points || 1 : 1;
    document.getElementById("tourBands").innerHTML = bands.map(function (b, i) {
      return rankRow(i, esc(b.display),
        '<span class="bar"><span style="width:' + Math.round(b.points / maxPts * 100) + '%"></span></span>' +
        '<span class="val">' + b.points + "</span>");
    }).join("") || '<p class="empty">За этот период очков ещё никто не набрал.</p>';
  }

  function renderLeaderboard(rows) {
    document.getElementById("lbRows").innerHTML = rows.map(function (r, i) {
      var name = r.username ? "@" + esc(r.username) : esc(r.full_name || "id" + r.user_id);
      var right = state.lb === "rockle"
        ? r.plays + " " + plural(r.plays, "партия", "партии", "партий") + " · " + secs(r.best_seconds)
        : r.active_days + " " + plural(r.active_days, "активный день", "активных дня", "активных дней");
      return rankRow(i, name, '<span class="val muted">' + right + "</span>");
    }).join("") || '<p class="empty">За этот период данных пока нет.</p>';
  }

  var KIND = { content: ["контент", "#dff26b"], feature: ["фича", "#d6d2ff"], giveaway: ["розыгрыш", "#ffc9a8"] };
  function kindOf(k) { return KIND[k] || [k, "#ffffff"]; }

  function renderReleases(rows) {
    document.getElementById("relChip").textContent = rows.length + " " + plural(rows.length, "релиз", "релиза", "релизов");
    document.getElementById("relRows").innerHTML = rows.map(function (r) {
      var p = r.released_at.slice(0, 10).split("-"), im = r.impact, right;
      if (!im || im.delta_pct === null) right = '<span class="val muted">н/д</span>';
      else if (im.days_elapsed_after < im.window_days) right = '<span class="val muted">идёт · ' + im.days_elapsed_after + "/" + im.window_days + " дн.</span>";
      else right = delta(im.delta_pct, arrow(im.delta_pct) + fmtPct(im.delta_pct) + " DAU");
      return row('<span class="kind-dot" style="background:' + kindOf(r.kind)[1] + '"></span>' + esc(r.label),
        right, p[2] + "." + p[1] + "." + p[0].slice(2) + " · " + esc(kindOf(r.kind)[0]));
    }).join("") || '<p class="empty">Пока нет отметок релизов — добавьте первую ниже.</p>';
  }

  // ---------- главный график ----------
  // Отметки релизов: пунктир в день релиза и стеклянная плашка с названием.
  // Дни берутся из chart.$isoDays (подписи оси — «дд.мм», по ним день не найти).
  var releaseMarkers = {
    id: "releaseMarkers",
    afterDatasetsDraw: function (c) {
      var isoDays = c.$isoDays;
      if (!isoDays || !state.releases.length) return;
      var ctx = c.ctx, area = c.chartArea, x = c.scales.x, prevEnd = -Infinity;
      state.releases.slice().sort(function (a, b) { return a.released_at < b.released_at ? -1 : 1; }).forEach(function (r) {
        var idx = isoDays.indexOf(r.released_at.slice(0, 10));
        if (idx === -1) return;
        var px = x.getPixelForValue(idx), color = kindOf(r.kind)[1];
        var label = r.label.length > 20 ? r.label.slice(0, 19) + "…" : r.label;
        ctx.save();
        ctx.strokeStyle = color; ctx.globalAlpha = 0.9; ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom); ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        ctx.font = "500 11px Manrope, -apple-system, sans-serif";
        var tw = ctx.measureText(label).width + 22, th = 20;
        var bx = Math.max(area.left, Math.min(px - tw / 2, area.right - tw));
        // если плашка налезает на предыдущую — опускаем её внутрь графика
        var by = bx < prevEnd + 6 ? area.top + 4 : area.top - 26;
        if (by < area.top) prevEnd = bx + tw;
        ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(bx, by, tw, th, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(bx + 10, by + th / 2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(label, bx + 17, by + th / 2 + 0.5);
        ctx.restore();
      });
    }
  };

  var CHART_METRICS = {
    subs: {
      title: "Рост подписчиков",
      note: "Точная история — с момента запуска аналитики; более ранний прирост виден одним начальным скачком в первый день.",
      load: async function () {
        var rows = (await apiFetch("/api/dashboard/subscribers?days=" + state.days)).series;
        return { days: rows.map(function (r) { return r.day; }), sets: [["Подписчики", rows.map(function (r) { return r.subscribers; })]] };
      }
    },
    dau: {
      title: "Активные по дням (DAU)",
      note: "Считаются заходы через бота; открытия мини-приложений и админы в DAU не попадают.",
      load: function () { return loadSets([["dau", "DAU"]]); }
    },
    "new": {
      title: "Новые пользователи по дням",
      note: "",
      load: function () { return loadSets([["new_users", "Новые"]]); }
    },
    games: {
      title: "Игры по дням",
      note: "«Найди группу» — пройденные пазлы, турнир — засчитанные забеги (один в день на человека).",
      load: function () { return loadSets([["rockle_completed", "«Найди группу»"], ["quiz:tournament", "Турнир"]]); }
    }
  };

  async function loadSets(pairs) {
    var results = await Promise.all(pairs.map(function (p) { return series(p[0]); }));
    return {
      days: results[0].map(function (r) { return r.day; }),
      sets: results.map(function (s, i) { return [pairs[i][1], s.map(function (r) { return r.n; })]; })
    };
  }

  async function loadMainChart() {
    var cfg = CHART_METRICS[state.metric];
    var data = await cfg.load();
    document.getElementById("chartTitle").textContent = cfg.title;
    var note = document.getElementById("chartNote");
    note.textContent = cfg.note;
    note.classList.toggle("hidden", !cfg.note);
    renderChart(data);
  }

  function renderChart(data) {
    var labels = data.days.map(function (d) { var p = d.split("-"); return p[2] + "." + p[1]; });
    var palette = [["#ffffff", "rgba(255,255,255,0.28)"], ["#ffc9a8", "rgba(255,201,168,0)"]];
    var many = data.sets.length > 1;
    var tick = "rgba(255,255,255,0.62)";
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("mainChart"), {
      type: "line",
      data: {
        labels: labels,
        datasets: data.sets.map(function (s, i) {
          var c = palette[i % palette.length];
          return {
            label: s[0], data: s[1], borderColor: c[0], borderWidth: 2, tension: 0.35,
            pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: "#dff26b", pointHoverBorderColor: "#fff",
            fill: many ? false : "origin",
            backgroundColor: function (ctx) {
              var a = ctx.chart.chartArea;
              if (!a) return c[1];
              var g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
              g.addColorStop(0, c[1]);
              g.addColorStop(1, "rgba(255,255,255,0)");
              return g;
            }
          };
        })
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        layout: { padding: { top: 34 } },
        plugins: {
          legend: { display: many, position: "bottom", labels: { color: "rgba(255,255,255,0.8)", boxWidth: 10, boxHeight: 10, usePointStyle: true, font: { family: "Manrope", size: 12 } } },
          tooltip: { backgroundColor: "rgba(30,70,86,0.82)", borderColor: "rgba(255,255,255,0.35)", borderWidth: 1, padding: 10, cornerRadius: 12,
            titleFont: { family: "Manrope", weight: "600" }, bodyFont: { family: "Manrope" } }
        },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { color: tick, maxTicksLimit: 8, font: { family: "Manrope", size: 11 } } },
          y: { beginAtZero: state.metric !== "subs", grid: { color: "rgba(255,255,255,0.13)" }, border: { display: false },
            ticks: { color: tick, precision: 0, font: { family: "Manrope", size: 11 } } }
        }
      },
      plugins: [releaseMarkers]
    });
    chart.$isoDays = data.days;
    chart.update("none");
  }

  // ---------- загрузка ----------
  async function loadReleases() {
    var data = await apiFetch("/api/dashboard/releases");
    state.releases = data.releases;
    if (chart) chart.update("none");
    var withImpact = await Promise.all(data.releases.map(async function (r) {
      try {
        var impact = await apiFetch("/api/dashboard/releases/" + r.id + "/impact?metric=dau&window_days=7");
        return Object.assign({}, r, { impact: impact });
      } catch (err) {
        return Object.assign({}, r, { impact: null });
      }
    }));
    renderReleases(withImpact);
  }

  async function loadLeaderboard() {
    var data = await apiFetch("/api/dashboard/leaderboard?metric=" + state.lb + "&days=" + state.days + "&limit=8");
    renderLeaderboard(data.leaderboard);
  }

  // Возвращает ряд открытий турнира — он же нужен строке «Турнир групп» в «Фичах».
  async function loadTournament() {
    var res = await Promise.all([
      series("feature:tournament_open"),
      series("quiz:tournament"),
      series("feature:party_promo"),
      apiFetch("/api/dashboard/tournament-bands?limit=5&days=" + state.days)
    ]);
    renderTournament(res[0], res[1], res[2], res[3].bands);
    return res[0];
  }

  async function loadAll() {
    document.querySelectorAll("#rangeSeg button").forEach(function (b) {
      b.classList.toggle("active", parseInt(b.dataset.days, 10) === state.days);
    });
    ["flowChip", "actChip", "tourChip"].forEach(function (id) {
      document.getElementById(id).textContent = "за " + state.days + " дн.";
    });
    try {
      var kpiP = apiFetch("/api/dashboard/kpi?days=" + state.days);
      var flowP = apiFetch("/api/dashboard/subscription-flow?days=" + state.days);
      var featP = Promise.all([series("feature:playlist"), series("feature:rockle_open"), series("quiz_total")]);
      var tourP = loadTournament();
      var chartP = loadMainChart();
      var relP = loadReleases();

      var kpi = await kpiP, flow = await flowP;
      renderTiles(kpi, flow);
      renderFlow(flow);
      renderActivity(kpi);

      var feats = await featP;
      renderFeatures(feats[0], feats[1], feats[2], await tourP);

      await chartP;
      await relP;
      await loadLeaderboard();
    } catch (err) {
      report(err);
    }
  }

  document.getElementById("relForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var label = document.getElementById("relLabel").value.trim();
    var kind = document.getElementById("relKind").value;
    var releasedAt = document.getElementById("relDate").value;
    var errEl = document.getElementById("relError");
    errEl.classList.add("hidden");
    if (!label || !releasedAt) {
      errEl.textContent = "Заполните название и дату.";
      errEl.classList.remove("hidden");
      return;
    }
    try {
      await apiFetch("/api/dashboard/releases", {
        method: "POST",
        body: JSON.stringify({ label: label, kind: kind, released_at: releasedAt })
      });
      document.getElementById("relLabel").value = "";
      await loadReleases();
    } catch (err) {
      errEl.textContent = "Не удалось сохранить релиз.";
      errEl.classList.remove("hidden");
    }
  });

  document.getElementById("relDate").value = new Date().toISOString().slice(0, 16);
  // Плашки релизов рисуются на canvas — перерисовать, когда догрузится Manrope.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (chart) chart.update("none"); });

  if (state.token) {
    showApp();
    loadAll();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
