<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Найди группу — Black Magic Woman</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --wall: #ece5d3;
    --wall-grain: 0.05;
    --paper: #f2ead2;
    --paper-shadow: rgba(28, 23, 18, 0.22);
    --ink: #1c1712;
    --ink-soft: #5a4f42;
    --rule: #c9bc98;
    --rust: #b8431c;
    --rust-deep: #8f3115;
    --amber: #b9822c;
    --petrol: #2b5c58;
    --selecting: rgba(184, 67, 28, 0.32);
    --found-bg: var(--rust);
    --found-ink: var(--paper);
    --focus-ring: #2b5c58;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #110d09;
      --wall-grain: 0.09;
      --paper: #e8dcbb;
      --paper-shadow: rgba(0, 0, 0, 0.55);
      --ink: #1a140f;
      --ink-soft: #4c4132;
      --rule: #c2b48b;
      --rust: #cc5729;
      --rust-deep: #9c3c18;
      --amber: #e0a53f;
      --petrol: #3d7d75;
      --selecting: rgba(204, 87, 41, 0.4);
      --focus-ring: #3d7d75;
    }
  }

  :root[data-theme="light"] {
    --wall: #ece5d3; --wall-grain: 0.05; --paper: #f2ead2; --paper-shadow: rgba(28, 23, 18, 0.22);
    --ink: #1c1712; --ink-soft: #5a4f42; --rule: #c9bc98; --rust: #b8431c; --rust-deep: #8f3115;
    --amber: #b9822c; --petrol: #2b5c58; --selecting: rgba(184, 67, 28, 0.32); --focus-ring: #2b5c58;
  }

  :root[data-theme="dark"] {
    --wall: #110d09; --wall-grain: 0.09; --paper: #e8dcbb; --paper-shadow: rgba(0, 0, 0, 0.55);
    --ink: #1a140f; --ink-soft: #4c4132; --rule: #c2b48b; --rust: #cc5729; --rust-deep: #9c3c18;
    --amber: #e0a53f; --petrol: #3d7d75; --selecting: rgba(204, 87, 41, 0.4); --focus-ring: #3d7d75;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px) 16px 64px;
    background-image:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,255,255,0.05), transparent 60%),
      repeating-radial-gradient(circle at 0 0, rgba(0,0,0,var(--wall-grain)) 0, rgba(0,0,0,var(--wall-grain)) 1px, transparent 1px, transparent 5px);
    background-size: auto, 5px 5px;
  }

  .wall {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .poster {
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.25) inset,
      0 24px 48px -20px var(--paper-shadow),
      0 2px 6px var(--paper-shadow);
    padding: 22px 20px 18px;
    position: relative;
    transform: rotate(-0.6deg);
  }

  .poster::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--rule);
    pointer-events: none;
  }

  .poster-head { text-align: center; margin-bottom: 14px; }

  .eyebrow {
    margin: 0 0 6px;
    font: 700 11px/1 -apple-system, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--petrol);
  }

  .title {
    margin: 0;
    font-family: "Futura", "Century Gothic", "Avenir Next Condensed", "Arial Narrow", sans-serif;
    font-weight: 800;
    font-stretch: condensed;
    font-size: clamp(34px, 10vw, 46px);
    text-transform: uppercase;
    color: var(--rust-deep);
    text-wrap: balance;
    line-height: 0.95;
  }

  .subtitle { margin: 8px 0 0; font-size: 13px; color: var(--ink-soft); }

  .already {
    margin: 10px 0 0;
    font-size: 12px;
    color: var(--petrol);
    font-weight: 600;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .meta { display: flex; flex-direction: column; line-height: 1.15; }

  .meta-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .meta-value {
    font-family: ui-monospace, "SF Mono", "Roboto Mono", "Courier New", monospace;
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .btn {
    appearance: none;
    border: 1px solid var(--rust-deep);
    background: transparent;
    color: var(--rust-deep);
    font: 700 11px/1 -apple-system, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 14px;
    border-radius: 2px;
    cursor: pointer;
  }

  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .btn-invert { background: var(--paper); color: var(--rust-deep); border-color: var(--paper); }

  .grid {
    display: grid;
    gap: 2px;
    background: var(--rule);
    border: 1px solid var(--rule);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: ui-monospace, "SF Mono", "Roboto Mono", "Courier New", monospace;
    font-weight: 700;
    font-size: min(4vw, 17px);
    color: var(--ink-soft);
    transition: background-color 120ms ease, color 120ms ease;
  }

  .cell.sel { background: var(--selecting); color: var(--ink); }

  .cell.found {
    background: var(--found-bg);
    color: var(--found-ink);
    animation: flash 420ms ease;
  }

  @keyframes flash { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .perforation {
    height: 12px;
    margin: 16px -20px 6px;
    background-image: radial-gradient(circle, var(--wall) 3px, transparent 3.5px);
    background-size: 14px 12px;
    background-position: 7px center;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
  }

  .setlist-label {
    margin: 6px 0 8px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
  }

  .hint-row {
    display: flex;
    justify-content: center;
    margin: 4px 0 2px;
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .words {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px 10px;
    min-height: 18px;
  }

  .words li {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    position: relative;
    padding-bottom: 2px;
  }

  .words li.placeholder {
    font-weight: 400;
    font-style: italic;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  .words li.done { color: var(--ink-soft); }

  .words li.done::after {
    content: "";
    position: absolute;
    left: -2px; right: -2px; top: 50%;
    height: 1.5px;
    background: var(--rust);
    transform: rotate(-3deg);
  }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    max-width: 320px;
    opacity: 0.85;
  }

  .status {
    text-align: center;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 40px 12px;
  }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 13, 9, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }

  .win-overlay[hidden] { display: none; }

  .stamp {
    background: var(--paper);
    border: 3px double var(--rust-deep);
    border-radius: 4px;
    padding: 28px 32px;
    text-align: center;
    transform: rotate(-3deg);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .stamp-title {
    margin: 0;
    font-family: "Futura", "Century Gothic", "Arial Narrow", sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 26px;
    color: var(--rust-deep);
  }

  .stamp-time {
    margin: 8px 0 18px;
    font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
    font-size: 15px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    .cell.found { animation: none; }
    .poster { transform: none; }
  }
</style>
</head>
<body>

<div class="wall">
  <main class="poster" id="poster" hidden>
    <header class="poster-head">
      <p class="eyebrow">Афиша дня · Black Magic Woman</p>
      <h1 class="title">Найди группу</h1>
      <p class="subtitle">Рок 1965–1979 — имена спрятаны в афише</p>
      <p class="already" id="alreadyNote" hidden></p>
    </header>

    <div class="meta-row">
      <div class="meta">
        <span class="meta-label">Время</span>
        <span class="meta-value" id="timer">00:00</span>
      </div>
      <div class="meta">
        <span class="meta-label">Найдено</span>
        <span class="meta-value"><span id="foundCount">0</span>/<span id="totalCount">0</span></span>
      </div>
      <div class="meta">
        <span class="meta-label">Жизни</span>
        <span class="meta-value" id="livesValue">❤️❤️❤️❤️❤️</span>
      </div>
    </div>

    <div class="grid" id="grid" role="img" aria-label="Сетка букв со спрятанными названиями рок-групп"></div>

    <div class="hint-row">
      <button class="btn" id="hintBtn" type="button">💡 Подсказка</button>
    </div>

    <div class="perforation" aria-hidden="true"></div>

    <p class="setlist-label">Разгаданные названия</p>
    <ul class="words" id="wordList"></ul>
  </main>

  <p class="status" id="status">Загружаем сегодняшнюю афишу…</p>

  <p class="hint" id="hint" hidden>Проведи пальцем (или мышью) по буквам — по горизонтали или вертикали, в любую сторону.</p>
</div>

<div class="win-overlay" id="winOverlay" hidden>
  <div class="stamp">
    <p class="stamp-title">Вечер удался</p>
    <p class="stamp-time" id="winTime"></p>
    <button class="btn btn-invert" id="againBtn" type="button">Ещё раз</button>
  </div>
</div>

<script>
  (function () {
    "use strict";

    var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      // Свайп вниз по сетке иначе распознаётся клиентом Telegram как жест
      // «свернуть/закрыть мини-апку» поверх любого touch-action в CSS — это
      // системный жест самого клиента, а не браузера. Метод новый (Bot API 7.7+),
      // поэтому проверяем, что он вообще есть, прежде чем звать.
      if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
      applyTheme();
      tg.onEvent("themeChanged", applyTheme);
    }

    function applyTheme() {
      var scheme = tg && tg.colorScheme ? tg.colorScheme : null;
      if (scheme === "dark" || scheme === "light") {
        document.documentElement.dataset.theme = scheme;
      }
    }

    var SIZE = 12;
    // Только по горизонтали/вертикали — без диагоналей: раз список групп
    // больше не виден целиком, диагональные слова делали игру слишком сложной.
    var DIRS = [
      [1, 0], [-1, 0], [0, 1], [0, -1]
    ];
    var FILLER = "EEEEAAAARRRTTTOOOIIISSSNNNLLLCCCUUUDDPPMMHHGGBBFFYYWWKKVVXZQJ";
    var START_LIVES = 5;

    // Детерминированный PRNG (FNV-1a хеш строки -> mulberry32), чтобы у всех
    // пользователей в один день была ИДЕНТИЧНАЯ сетка — сид берём из даты,
    // которую прислал сервер.
    function hashSeed(str) {
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    var rng = Math.random; // подменяется на seeded после получения даты с сервера

    var gridEl = document.getElementById("grid");
    var posterEl = document.getElementById("poster");
    var statusEl = document.getElementById("status");
    var hintEl = document.getElementById("hint");
    var alreadyNoteEl = document.getElementById("alreadyNote");
    var wordListEl = document.getElementById("wordList");
    var timerEl = document.getElementById("timer");
    var foundCountEl = document.getElementById("foundCount");
    var totalCountEl = document.getElementById("totalCount");
    var livesValueEl = document.getElementById("livesValue");
    var hintBtn = document.getElementById("hintBtn");
    var winOverlay = document.getElementById("winOverlay");
    var winTimeEl = document.getElementById("winTime");

    var grid, cells, placedWords, remaining, foundTotal, lives, revealed, revealOrder, startTime, tickHandle, dragging, startCell, path;
    var initData = tg ? (tg.initData || "") : "";

    function emptyGrid() {
      var g = [];
      for (var r = 0; r < SIZE; r++) g.push(new Array(SIZE).fill(null));
      return g;
    }

    function tryPlace(word) {
      for (var attempt = 0; attempt < 400; attempt++) {
        var dir = DIRS[Math.floor(rng() * DIRS.length)];
        var row = Math.floor(rng() * SIZE);
        var col = Math.floor(rng() * SIZE);
        var fits = true;
        for (var i = 0; i < word.length; i++) {
          var r = row + dir[0] * i;
          var c = col + dir[1] * i;
          if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) { fits = false; break; }
          var existing = grid[r][c];
          if (existing !== null && existing !== word[i]) { fits = false; break; }
        }
        if (fits) {
          for (var j = 0; j < word.length; j++) {
            grid[row + dir[0] * j][col + dir[1] * j] = word[j];
          }
          return true;
        }
      }
      return false; // редкий случай — слово в сегодняшнюю сетку не поместилось
    }

    function buildPuzzle(words) {
      grid = emptyGrid();
      var order = words.slice().sort(function (a, b) { return b.key.length - a.key.length; });
      var placed = [];
      order.forEach(function (w) { if (tryPlace(w.key)) placed.push(w); });
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          if (grid[r][c] === null) grid[r][c] = FILLER[Math.floor(rng() * FILLER.length)];
        }
      }
      return placed; // только реально размещённые слова считаются «в игре»
    }

    function renderGrid() {
      gridEl.style.gridTemplateColumns = "repeat(" + SIZE + ", 1fr)";
      gridEl.innerHTML = "";
      cells = [];
      for (var r = 0; r < SIZE; r++) {
        cells.push([]);
        for (var c = 0; c < SIZE; c++) {
          var div = document.createElement("div");
          div.className = "cell";
          div.textContent = grid[r][c];
          div.dataset.r = r;
          div.dataset.c = c;
          gridEl.appendChild(div);
          cells[r].push(div);
        }
      }
    }

    // Список внизу больше не показывает все группы сразу — только те, что либо
    // уже найдены, либо открыты подсказкой (взгляд на название не палит клетки).
    function renderWordList() {
      wordListEl.innerHTML = "";
      totalCountEl.textContent = String(placedWords.length);
      if (!revealOrder.length) {
        var placeholder = document.createElement("li");
        placeholder.className = "placeholder";
        placeholder.textContent = "Пока пусто — ищи на слух или жми «Подсказка»";
        wordListEl.appendChild(placeholder);
        return;
      }
      revealOrder.forEach(function (key) {
        var w = revealed[key];
        var li = document.createElement("li");
        li.textContent = w.display;
        li.dataset.key = key;
        if (w.done) li.classList.add("done");
        wordListEl.appendChild(li);
      });
    }

    function revealWord(key, done) {
      var entry = revealed[key];
      if (!entry) {
        var w = placedWords.filter(function (p) { return p.key === key; })[0];
        if (!w) return;
        entry = revealed[key] = { display: w.display, done: false };
        revealOrder.push(key);
      }
      if (done) entry.done = true;
      renderWordList();
    }

    function updateLives() {
      livesValueEl.textContent = "❤️".repeat(lives) + "🖤".repeat(START_LIVES - lives);
      var hintsLeft = Object.keys(remaining).some(function (key) { return !revealed[key]; });
      hintBtn.disabled = lives <= 0 || !hintsLeft;
    }

    function useHint() {
      if (hintBtn.disabled) return;
      var pool = Object.keys(remaining).filter(function (key) { return !revealed[key]; });
      if (!pool.length) return;
      var key = pool[Math.floor(rng() * pool.length)];
      lives--;
      revealWord(key, false);
      updateLives();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    }

    function startTimerLoop() {
      remaining = {};
      placedWords.forEach(function (w) { remaining[w.key] = true; });
      foundTotal = 0;
      foundCountEl.textContent = "0";
      lives = START_LIVES;
      revealed = {};
      revealOrder = [];
      updateLives();
      startTime = Date.now();
      clearInterval(tickHandle);
      tickHandle = setInterval(updateTimer, 500);
      updateTimer();
      winOverlay.hidden = true;
    }

    function updateTimer() {
      var s = Math.floor((Date.now() - startTime) / 1000);
      var mm = String(Math.floor(s / 60)).padStart(2, "0");
      var ss = String(s % 60).padStart(2, "0");
      timerEl.textContent = mm + ":" + ss;
    }

    function cellAt(clientX, clientY) {
      var el = document.elementFromPoint(clientX, clientY);
      if (!el) return null;
      var cellEl = el.closest ? el.closest(".cell") : null;
      if (!cellEl || !gridEl.contains(cellEl)) return null;
      return { r: parseInt(cellEl.dataset.r, 10), c: parseInt(cellEl.dataset.c, 10) };
    }

    function clearSelection() {
      (path || []).forEach(function (p) { cells[p.r][p.c].classList.remove("sel"); });
      path = [];
    }

    function paintSelection() {
      (path || []).forEach(function (p) { cells[p.r][p.c].classList.add("sel"); });
    }

    function straightPath(a, b) {
      var dr = b.r - a.r, dc = b.c - a.c;
      if (dr === 0 && dc === 0) return [a];
      var straight = dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc);
      if (!straight) return null;
      var steps = Math.max(Math.abs(dr), Math.abs(dc));
      var sr = dr === 0 ? 0 : dr / Math.abs(dr);
      var sc = dc === 0 ? 0 : dc / Math.abs(dc);
      var out = [];
      for (var i = 0; i <= steps; i++) out.push({ r: a.r + sr * i, c: a.c + sc * i });
      return out;
    }

    function pathWord(p) {
      return p.map(function (pt) { return grid[pt.r][pt.c]; }).join("");
    }

    function onDown(e) {
      var c = cellAt(e.clientX, e.clientY);
      if (!c) return;
      dragging = true;
      startCell = c;
      path = [c];
      paintSelection();
      e.preventDefault();
    }

    function onMove(e) {
      if (!dragging) return;
      var c = cellAt(e.clientX, e.clientY);
      if (!c) return;
      var next = straightPath(startCell, c);
      if (!next) return;
      clearSelection();
      path = next;
      paintSelection();
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      if (path && path.length > 1) checkMatch(path);
      clearSelection();
    }

    function checkMatch(p) {
      var word = pathWord(p);
      var reversed = word.split("").reverse().join("");
      var match = null;
      Object.keys(remaining).forEach(function (key) {
        if (remaining[key] && (key === word || key === reversed)) match = key;
      });
      if (!match) return;
      delete remaining[match];
      foundTotal++;
      foundCountEl.textContent = String(foundTotal);
      p.forEach(function (pt) { cells[pt.r][pt.c].classList.add("found"); });
      revealWord(match, true);
      updateLives();
      if (foundTotal === placedWords.length) finishGame();
    }

    function finishGame() {
      clearInterval(tickHandle);
      hintBtn.disabled = true;
      var seconds = Math.floor((Date.now() - startTime) / 1000);
      winTimeEl.textContent = "Время: " + timerEl.textContent;
      winOverlay.hidden = false;
      submitResult(seconds);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    }

    function submitResult(seconds) {
      fetch("/api/rockle/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: initData, seconds: seconds })
      }).catch(function () { /* тихо игнорируем — игра уже сыграна локально */ });
    }

    function replay() {
      startTimerLoop();
      renderWordList();
      renderGrid();
    }

    gridEl.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    document.getElementById("againBtn").addEventListener("click", replay);
    hintBtn.addEventListener("click", useHint);

    function showError(text) {
      statusEl.textContent = text;
      statusEl.hidden = false;
      posterEl.hidden = true;
      hintEl.hidden = true;
    }

    fetch("/api/rockle/today?initData=" + encodeURIComponent(initData))
      .then(function (r) { if (!r.ok) throw new Error("bad status"); return r.json(); })
      .then(function (data) {
        if (!data.words || !data.words.length) {
          showError("Афиша на сегодня ещё не готова. Загляни чуть позже 🤘");
          return;
        }
        rng = mulberry32(hashSeed(data.date));
        placedWords = buildPuzzle(data.words);

        statusEl.hidden = true;
        posterEl.hidden = false;
        hintEl.hidden = false;

        if (data.already_completed != null) {
          var mm = String(Math.floor(data.already_completed / 60)).padStart(2, "0");
          var ss = String(data.already_completed % 60).padStart(2, "0");
          alreadyNoteEl.textContent = "Сегодня уже пройдено за " + mm + ":" + ss + " — можно сыграть ещё раз просто так.";
          alreadyNoteEl.hidden = false;
        }

        renderGrid();
        startTimerLoop();
        renderWordList();
      })
      .catch(function () {
        showError("Не получилось загрузить афишу. Проверь связь и попробуй снова 🤘");
      });
  })();
</script>
</body>
</html>
